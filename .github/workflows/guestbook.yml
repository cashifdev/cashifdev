name: Guestbook
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: guestbook
  cancel-in-progress: false
jobs:
  sign:
    if: startsWith(github.event.issue.title, 'guestbook:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gb
        run: python3 scripts/guestbook.py
      - if: steps.gb.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Guestbook: @${{ github.event.issue.user.login }}" || exit 0
          git pull --rebase && git push
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.gb.outputs.ok }}' === 'true';
            const body = ok
              ? `ACCESS GRANTED 🟢 Thanks @${context.payload.issue.user.login}, you're on the [guestbook](https://github.com/${context.repo.owner}). Try the interactive terminal: https://${context.repo.owner}.github.io`
              : `Your message was empty. Open a new issue titled \`guestbook: your message\`.`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: ok ? 'completed' : 'not_planned'});
